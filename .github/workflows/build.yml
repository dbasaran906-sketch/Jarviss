name: JARVIS V2 APK Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Project Source
        run: |
          mkdir -p workspace
          ZIP=$(find . -maxdepth 3 -name "*.zip" | head -n 1)
          if [ -n "$ZIP" ]; then
            unzip -q "$ZIP" -d workspace
          else
            cp -r ./* workspace/ 2>/dev/null || true
          fi
          python3 -c '
          import glob
          for path in glob.glob("workspace/**/*.kt", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  s = f.read()
              s = s.replace(r"\[", r"\\[").replace(r"\]", r"\\]")
              with open(path, "w", encoding="utf-8") as f:
                  f.write(s)
          '

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          PROJECT_DIR=$(find workspace -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon -PversionCode=${{ github.run_number }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-HUD-APK
          path: workspace/**/app/build/outputs/apk/debug/*.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_FILE=$(find workspace -name "*.apk" | head -n 1)
          cp "$APK_FILE" Jarvis.apk
          TAG="v2.0.${{ github.run_number }}"
          gh release create "$TAG" Jarvis.apk --title "JARVIS HUD $TAG" --notes "JARVIS V2 Tam Surum APK ($TAG)" --latest
          
